# CI runs the same commands as the nix dev shell (AGENTS.md),
# but on plain GitHub-hosted toolchains — every tool is pinned to
# the exact dev-shell version (rust-toolchain.toml, the
# *-VERSION/*-SHA256 env pins below and the flake's devShell must
# stay in sync, or the pre-commit hook and CI disagree). Renovate
# bumps the pinned versions (renovate.json customManagers); a
# version bump always needs its SHA256 updated in the same PR.
# Every action is pinned to a full commit SHA.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same branch/PR cancels the superseded run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # treefmt --ci is unusable here: the slint formatter rewrites
  # unchanged content (mtime), so --fail-on-change always fires —
  # format and fail on any content diff instead
  #
  # the tools are downloaded as release binaries (sha256-verified)
  # instead of coming from a distro package: the versions must
  # match the dev shell exactly
  format:
    runs-on: ubuntu-24.04
    env:
      TREEFMT_VERSION: "2.6.0"
      TREEFMT_SHA256: "2deff4c0f381d560784c5632cf5860da712891ccd9185306e73d8ba37778ab7f"
      SLINT_LSP_VERSION: "1.19.0"
      SLINT_LSP_SHA256: "a9e8a2ba904965c5cc01ca783aee44fcac91354e047b78997136ad3d3dde4dff"
      SHFMT_VERSION: "3.13.1"
      SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
      NIXFMT_VERSION: "1.5.0"
      NIXFMT_SHA256: "aa029247ab89c897e2f3948463967553f902f86e86e3402fa28cb29c4a44f745"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rustfmt comes from the pinned toolchain
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          components: rustfmt
      # slint-lsp (runtime) needs these shared libraries
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          libfontconfig1 libfreetype6 libgbm1 libinput10 libudev1 libxkbcommon0
      # prettier and its svelte plugin come from web/node_modules
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # keep in sync with the dev shell (flake.nix)
      - run: cd web && bun install --frozen-lockfile
      - name: Install the pinned formatter tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/format-tools"
          mkdir -p "$tools"
          fetch() { # url, output path, expected sha256
            curl -sSfL --retry 3 -o "$2" "$1"
            printf '%s  %s\n' "$3" "$2" | sha256sum --check --status
          }
          fetch "https://github.com/numtide/treefmt/releases/download/v${TREEFMT_VERSION}/treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz" \
            "$RUNNER_TEMP/treefmt.tar.gz" "$TREEFMT_SHA256"
          tar -xzf "$RUNNER_TEMP/treefmt.tar.gz" -C "$tools" treefmt
          chmod +x "$tools/treefmt"
          fetch "https://github.com/slint-ui/slint/releases/download/v${SLINT_LSP_VERSION}/slint-lsp-linux.tar.gz" \
            "$RUNNER_TEMP/slint-lsp.tar.gz" "$SLINT_LSP_SHA256"
          tar -xzf "$RUNNER_TEMP/slint-lsp.tar.gz" -C "$RUNNER_TEMP" slint-lsp/slint-lsp
          mv "$RUNNER_TEMP/slint-lsp/slint-lsp" "$tools/slint-lsp"
          chmod +x "$tools/slint-lsp"
          fetch "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            "$tools/shfmt" "$SHFMT_SHA256"
          fetch "https://github.com/NixOS/nixfmt/releases/download/v${NIXFMT_VERSION}/nixfmt" \
            "$tools/nixfmt" "$NIXFMT_SHA256"
          # curl keeps 0644 — treefmt needs every tool executable
          chmod +x "$tools"/*
          echo "$tools" >> "$GITHUB_PATH"
      - run: |
          export PATH="$PWD/web/node_modules/.bin:$PATH"
          treefmt
      - run: git diff --exit-code

  # mestro-remote embeds web/dist at compile time (its build.rs): the web
  # app is built before every Rust job
  #
  # apt: what the dev shell's buildInputs provide — the slint
  # femtovg/skia/winit/linuxkms backends need them at build time
  clippy-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          components: clippy
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          pkg-config libfontconfig1-dev libudev-dev libseat-dev libxkbcommon-dev
          libinput-dev libgbm-dev libegl-dev libgles-dev libwayland-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # keep in sync with the dev shell (flake.nix)
      - run: cd web && bun install --frozen-lockfile && bun run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - run: cargo clippy --all-targets -- -D warnings

  clippy-kiosk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          components: clippy
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          pkg-config libfontconfig1-dev libudev-dev libseat-dev libxkbcommon-dev
          libinput-dev libgbm-dev libegl-dev libgles-dev libwayland-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # keep in sync with the dev shell (flake.nix)
      - run: cd web && bun install --frozen-lockfile && bun run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kiosk
      - run: cargo clippy -p mestro --no-default-features --features linuxkms,ota,rpi,wifi-setup,audio-output,timezone --all-targets -- -D warnings
      # the OS crate's own clippy run: -p mestro compiles it (the
      # feature forwards) but lints only the binary. The web crate's
      # run is the same idea
      - run: cargo clippy -p mestro-os --features wifi-setup,audio-output,timezone --all-targets -- -D warnings
      - run: cargo clippy -p mestro-remote --features ota,wifi-setup,audio-output,timezone --all-targets -- -D warnings
      # mestro-update with its Pi boot backend (the desktop clippy
      # run above covers the no-backend build)
      - run: cargo clippy -p mestro-update --features cli,rpi --all-targets -- -D warnings

  # the fonts mirror the dev shell's FONTCONFIG_FILE for the
  # #[ignore]d visual snapshot tests (they need any text font;
  # Material Symbols has no Ubuntu package — icons render empty
  # in those snapshots, they never run in CI)
  test-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          pkg-config libfontconfig1-dev libudev-dev libseat-dev libxkbcommon-dev
          libinput-dev libgbm-dev libegl-dev libgles-dev libwayland-dev
          fonts-dejavu-core fonts-noto-core
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # keep in sync with the dev shell (flake.nix)
      - run: cd web && bun install --frozen-lockfile && bun run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - run: cargo test

  test-kiosk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          pkg-config libfontconfig1-dev libudev-dev libseat-dev libxkbcommon-dev
          libinput-dev libgbm-dev libegl-dev libgles-dev libwayland-dev
          fonts-dejavu-core fonts-noto-core
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # keep in sync with the dev shell (flake.nix)
      - run: cd web && bun install --frozen-lockfile && bun run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kiosk
      # the feature flags live on the binary crate (crates/mestro)
      # and on mestro-os/mestro-remote (`wifi-setup`/`audio-output`/
      # `timezone`, forwarded by the binary's features of the same
      # names); -p scopes them there
      - run: cargo test -p mestro --features ota,rpi,wifi-setup,audio-output,timezone
      - run: cargo test -p mestro-os --features wifi-setup,audio-output,timezone
      - run: cargo test -p mestro-remote --features ota,wifi-setup,audio-output,timezone
      # the A/B update, its CLI and the golden test against the old
      # shell script, with the Pi boot backend
      - run: cargo test -p mestro-update --features cli,rpi

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # keep in sync with the dev shell (flake.nix)
      - run: cd web && bun install --frozen-lockfile && bun run check && bun test && bun run build

  # cargo-deny release binary (static musl build) instead of the
  # Docker action: the version must match the dev shell exactly
  deny:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.19.6"
      CARGO_DENY_SHA256: "0021d321c781f0159a150ca308859ad93ccce64a887b22ad2e129f096a8a2c07"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # cargo-deny shells out to `cargo metadata`
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - name: Install the pinned cargo-deny
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" cargo-deny.tar.gz | sha256sum --check --status
          tar -xzf cargo-deny.tar.gz --strip-components=1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          mkdir -p "$HOME/.local/bin" && mv cargo-deny "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo deny check

  # cargo-machete release binary (static musl build), faster than
  # the action (which installs the latest, not the pinned version)
  machete:
    runs-on: ubuntu-24.04
    env:
      CARGO_MACHETE_VERSION: "0.9.2"
      CARGO_MACHETE_SHA256: "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned cargo-machete
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o cargo-machete.tar.gz \
            "https://github.com/bnjbvr/cargo-machete/releases/download/v${CARGO_MACHETE_VERSION}/cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_MACHETE_SHA256" cargo-machete.tar.gz | sha256sum --check --status
          tar -xzf cargo-machete.tar.gz --strip-components=1 \
            "cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl/cargo-machete"
          mkdir -p "$HOME/.local/bin" && mv cargo-machete "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo-machete
