# CI runs exactly the dev-shell commands from AGENTS.md so local
# and CI are the same environment (same nixpkgs, same tool
# versions). Every action is pinned to a full commit SHA.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same branch/PR cancels the superseded run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # treefmt --ci is unusable here: the slint formatter rewrites
  # unchanged content (mtime), so --fail-on-change always fires —
  # format and fail on any content diff instead
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      # prettier and its svelte plugin come from web/node_modules
      - run: nix develop -c bash -c "cd web && bun install --frozen-lockfile"
      - run: nix develop -c treefmt
      - run: git diff --exit-code

  # the binary embeds web/dist at compile time (build.rs): the web
  # app is built before every Rust job
  clippy-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - run: nix develop -c bash -c "cd web && bun install --frozen-lockfile && bun run build"
      - run: nix develop -c cargo clippy --all-targets -- -D warnings

  clippy-kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kiosk
      - run: nix develop -c bash -c "cd web && bun install --frozen-lockfile && bun run build"
      - run: nix develop -c cargo clippy --no-default-features --features linuxkms,ota,wifi-setup --all-targets -- -D warnings

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - run: nix develop -c bash -c "cd web && bun install --frozen-lockfile && bun run build"
      - run: nix develop -c cargo test

  test-kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kiosk
      - run: nix develop -c bash -c "cd web && bun install --frozen-lockfile && bun run build"
      - run: nix develop -c cargo test --features ota,wifi-setup

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix develop -c bash -c "cd web && bun install --frozen-lockfile && bun run check && bun test && bun run build"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix develop -c cargo deny check

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix develop -c cargo machete
