[workspace]
resolver = "2"
members = ["crates/*"]

# shared dependency versions: members reference these with
# `{ workspace = true }` so the versions cannot drift between crates.
# Renovate updates them here like it did the single manifest.
[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true

# fast kiosk iteration (`nix develop .#pi -c cargo build --profile pi`):
# release codegen without fat LTO — all cores, incremental. The image
# keeps [profile.release]
[profile.pi]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
