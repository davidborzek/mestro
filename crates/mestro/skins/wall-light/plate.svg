<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 344">
<!-- the seamless plate radial, centered on the window middle —
     one piece now: the engine stretches it over the whole zone
     (the plate contract, docs/vu.md), so it stays band-free on
     any aspect. Same falloff as the former half tiles: r=119%,
     stop offsets untouched -->
<defs><radialGradient id="plate" cx="50%" cy="50%" r="119%">
  <stop offset="0" stop-color="#f4ecda"/>
  <stop offset="0.55" stop-color="#ece1ca"/>
  <stop offset="1" stop-color="#d9ccab"/>
</radialGradient></defs>
<rect width="573" height="344" fill="url(#plate)"/>
</svg>
