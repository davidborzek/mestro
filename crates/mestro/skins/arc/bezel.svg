<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
<!-- chrome frame as ONE filled silhouette (outer arc r=84, base
     bar down to y=131, the r=78 dial window cut out above the
     baseline via evenodd) — no arc/bar junction, no notches.
     Pivot circle at (90,128). Topmost layer: the glow wash and
     the needle stay under it -->
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5f1e4"/>
    <stop offset="0.5" stop-color="#b7ae93"/>
    <stop offset="1" stop-color="#5c5540"/>
  </linearGradient>
</defs>
<!-- the silhouette: outer arc + base bar, dial window cut out -->
<path fill="url(#chrome)" fill-rule="evenodd"
      d="M 6 128 A 84 84 0 0 1 174 128 L 174 131 L 6 131 Z
         M 12 128 A 78 78 0 0 1 168 128 Z"/>
<!-- outline the whole silhouette, hairline dark -->
<path fill="none" stroke="#00000055" stroke-width="1"
      d="M 6 128 A 84 84 0 0 1 174 128 L 174 131 L 6 131 Z
         M 12 128 A 78 78 0 0 1 168 128"/>
<!-- highlight along the bar top and the outer arc, subtle -->
<rect x="8" y="126" width="164" height="1.3" fill="#ffffff30"/>
<!-- crisp window edge against the dial face -->
<path d="M 12 128 A 78 78 0 0 1 168 128" fill="none"
      stroke="#00000040" stroke-width="1"/>
<!-- specular highlight riding the outer arc, top third -->
<path d="M 44.7 60.5 A 84 84 0 0 1 135.3 60.5" fill="none"
      stroke="#ffffff70" stroke-width="1.6"/>
</svg>
