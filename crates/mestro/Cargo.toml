[package]
name = "mestro"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
# never published to crates.io
publish = false

[dependencies]
# everything that talks to the device's OS or hardware:
# the base plumbing, the backlight backends, the wifi lane,
# squeezelite's audio lane, the timezone picker and the
# factory reset — the workspace's two audited unsafe sites
# live here
mestro-os = { path = "../mestro-os", version = "0.1.0" }
# the wire protocol: the control vocabulary, the web endpoint's JSON
# requests/responses and the ctl socket's line framing
mestro-ipc = { path = "../mestro-ipc", version = "0.1.0" }
# the player domain: source contract, state machine, shell, cover
# seam, artwork palette (RGB)
mestro-player = { path = "../mestro-player", version = "0.1.0" }
# the remote-control surface: the web endpoint (server, auth,
# pairing, captive portal, OTA, push pipeline) and the ctl
# socket — behind the ports this binary implements (the slint UI
# port, the MA auth client)
mestro-remote = { path = "../mestro-remote", version = "0.1.0" }
# exact pin: all slint crates move as one (renovate.json groups
# them); a bump needs the snapshot tests re-run (CONTRIBUTING.md)
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "renderer-femtovg", "renderer-software"] }
# runtime-compiled VU skins (ComponentContainer embedding)
slint-interpreter = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg", "internal"] }
# only to name InternalToken + ComponentSelection for the
# interpreter's component selection (embedded skins are
# non-Window exports; see vu/manifest.rs) — internal crates, so
# they must be pinned to the exact same version as slint
i-slint-core = { version = "=1.19.0", default-features = false }
i-slint-compiler = { version = "=1.19.0", default-features = false }
spin_on = "0.1"
# the shared-state locks (VU levels, pairing gate, MA config, cover caches)
parking_lot = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde.workspace = true
serde_json = "1"
toml = "1"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustfft = "6.4.1"
qrcode = { version = "0.15", default-features = false }
[features]
# default = dev/desktop: the winit backend under a compositor.
# The linuxkms feature adds the straight-on-DRM kiosk backend
# (the Pi image) and with it the --output flag (SLINT_DRM_OUTPUT
# per process — a second process with --output drives the second
# screen). Kiosk: --no-default-features --features linuxkms.
default = ["desktop"]
# skia alongside femtovg: femtovg (glutin) doesn't work on plain
# wayland compositors (glutin built without wayland EGL — slint
# #3312), so desktop dev runs on skia via SLINT_BACKEND=winit-skia.
# The kiosk (linuxkms/GBM) stays on femtovg.
desktop = ["slint/backend-winit", "slint/renderer-skia"]
linuxkms = ["slint/backend-linuxkms", "slint-interpreter/backend-linuxkms"]
# the web endpoint's POST /ota: streams an uploaded system image
# into mestro-upgrade (the Pi image enables it)
ota = ["mestro-remote/ota"]
# the wifi setup lane (mestro-os): wpa_supplicant ctrl client,
# AP mode + captive portal policy, the join state machine and
# the factory reset's wifi half. Kiosk builds enable it next
# to `ota`; desktop builds stay without it (the factory reset
# op is a wifi-setup capability of the binary)
wifi-setup = ["mestro-os/wifi-setup", "mestro-remote/wifi-setup"]
# the web app's audio output picker: lists the ALSA playback
# devices, sets the audio.* settings and writes squeezelite's env
# file from them (image only)
audio-output = ["mestro-os/audio-output", "mestro-remote/audio-output"]
# the web app's timezone picker: writes TZ into mestro's env file and
# restarts the player (image only; a desktop follows the OS zone)
timezone = ["mestro-os/timezone", "mestro-remote/timezone"]

# developer tools, not shipped (cargo run --example <name>)
[[example]]
name = "wscap"
path = "tools/wscap.rs"

[[example]]
name = "vu-feed"
path = "tools/vu-feed.rs"

[build-dependencies]
slint-build = { version = "=1.19.0" }

[dev-dependencies]
# temp-dir state for the conf-writer and factory-reset tests
tempfile = "3"

[lints.rust]
# the audited unsafe sites live in mestro-os (pinned by its
# tests/unsafe_pin.rs); the local #[allow(unsafe_code)] that
# remains is slint's generated code (ItemTreeVTable_static),
# which forbid would break
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
