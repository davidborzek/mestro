# mestro configuration — copy to $XDG_CONFIG_HOME/mestro/config.toml
# or pass MESTRO_CONFIG=<path>. A missing file means defaults.
# Precedence: defaults < this file < MESTRO_* env vars < CLI flags.
# MESTRO_TOKEN is env-only and never belongs in here.

[window]
# logical window size; --size on the CLI overrides this
size = "800x480"
fullscreen = false
# UI scale factor (0.5..3.0): renders everything larger — for
# panels that show the resolution physically small (e.g. a 5"
# 800x480). 1.0 = off. The window reflows into
# physical-width/factor logical pixels.
scale = 1.0

[display]
# backlight brightness in percent (1..100); unset = keep what
# the system booted with
#brightness = 80
# backlight in percent while the standby clock shows
standby-brightness = 15
# which backend sets it: auto | firmware (Pi mailbox) | sysfs | none
backlight = "auto"

[music-assistant]
# websocket endpoint of the Music Assistant server
url = "ws://ma.example.com:8095/ws"
# exact name of the player to show; empty = auto-pick (the playing
# one, else the most available — deterministic by id)
player = "Living Room"
# long-lived API token — a value here beats the MESTRO_TOKEN
# env; editable on-device (settings → Connection)
# token = ""

[theme]
# named palette: "amber" (gruvbox-toned warm) or "cover" -
# the accent follows the artwork's dominant color
palette = "amber"
# the Material You scheme variant for palette = "cover":
# tonal-spot | content | expressive | fidelity | fruit-salad |
# monochrome | neutral | rainbow | vibrant
#variant = "tonal-spot"

# [keyboard]: key name -> control command (src/remote/keyboard.rs),
# overriding the built-in defaults. Key names: up, down, left,
# right, escape, backspace, enter, tab, delete, space, home,
# end, pageup, pagedown, f1..f12, or any single character.
# Commands: cycle-forward, cycle-back, back, home, play-pause,
# next-track, prev-track, volume-up, volume-down.
# The defaults fit USB HID remotes (arrows / OK=Enter /
# Back=Escape / Home=Home) with VLC and Kodi conventions as
# keyboard fallbacks:
#   arrows = VU cycle, space/enter = play-pause,
#   n/pagedown = next, p/pageup = previous,
#   +/f12 = volume up, -/f11 = volume down
[keyboard]
#right = "cycle-forward"
#escape = "back"
#m = "home"

# [osd]: the notification layer. Base flags gate each kind —
# transport ("Playing"/"Paused"), track ("Title — Artist" on
# skips), queue ("Title — Artist (+n)" on additions), volume
# (the OSD on control-channel changes). Position/volume-position
# anchor the tiles: top | bottom | left | right | center.
# Style: translucent (glass, default) | solid.
# [osd.now-playing] and [osd.vu] override the base flags while
# those layers are open — only name what differs (e.g. transport
# = false because the view already shows the state).
[osd]
transport = true
track = true
queue = true
volume = true
position = "bottom"
volume-position = "bottom"
style = "translucent"
# how long the tiles stay (ms)
toast-duration = 2600
volume-duration = 1800

[osd.now-playing]
transport = false
track = false

[osd.vu]
transport = false
track = false

[now-playing]
# the layout:
#   side      square cover left, metadata column right (default)
#   fullbleed sharp cover edge to edge as the background, the
#             metadata cluster hugs the bottom over a scrim
layout = "side"
# which inline VU to show under the track metadata:
#   led     segmented LED strips (default)
#   thin    two hairline bars, minimal
#   matrix  the spectrum as a dim bar matrix behind the whole
#           view (the eversolo background visualizer)
#   off     none
inline-vu = "led"
# which stream quality parts to show, in this order:
#   codec    the badge (FLAC, MP3, …)
#   rate     44.1 kHz
#   depth    16 bit
#   bitrate  kbps — only when the stream reports one (lossless
#            usually does not)
#   channels 2 ch
# duplicates warn and dedupe; an empty list shows nothing
quality = ["codec", "rate", "depth"]
# which transport buttons the now-playing row shows, in display
# order — the play/pause button keeps its round accent styling
# wherever it sits:
#   shuffle    the queue shuffle toggle
#   previous   previous track
#   play-pause the round accent button (play/pause/loading)
#   next       next track
#   repeat     off → all → one per tap
# an empty list hides the row entirely
controls = ["shuffle", "previous", "play-pause", "next", "repeat"]

[now-playing.font]
# per-line sizes (px) and weights — defaults shown, the built-in
# look. Sizes clamp to 8..48, weights to 100..900
title-size = 24
title-weight = 700
artist-size = 18
artist-weight = 400
album-size = 14
album-weight = 400
quality-size = 12
quality-weight = 400

[hub]
# the hub layout:
#   cards   console-row glass cards (default)
#   list    editorial word list — full-width rows
layout = "cards"
# the destinations in display order (cards and list alike).
# Duplicates warn and dedupe; omitted entries append at the end
order = ["library", "search", "settings", "standby"]

[clock]
# standby clock face: digital (dim HH:MM) or analog (dim dial)
style = "digital"

[clock.background]
# what sits behind the clock: black | cover | folder
source = "black"
# darkening over the image, 0 (image as is)..1 (black)
dim = 0.6
# blurred instead of sharp (cover has a blurred variant ready,
# folder images blur on load)
blur = false
# folder source: image directory (jpg/png), shuffled slideshow
folder = "/data/backgrounds"
# folder source: minutes per image (0 = never change)
interval = 10

[background]
# blurred cover art as the now-playing background
blurred_cover = true

[ui]
# open the now-playing overlay when playback starts from a
# library tap (track rows, the detail play button) or from
# outside while the player sits in standby (MA web UI, Home
# Assistant)
auto_open_now_playing = true
# nav rail look: "dark" (bezel glass) or "glass" (translucent —
# the blurred-cover backdrop runs under the rail and shows
# through)
rail = "dark"
# which layout the search keyboard renders — a key of the
# OskLayouts registry in ui/osk.slint ("de" or "en"; unknown
# names fall back to qwertz-de)
osk_layout = "de"

[vu]
# shmem needs a squeezelite built with -DVISEXPORT, started with
# -v (its shm lands at /dev/shm/squeezelite-<MAC>); mock
# synthesizes levels while something plays
mode = "shmem"              # shmem | mock | off
# 0 VU alignment in dBFS — modern loud masters center the needle
# around 0 at -14
reference_dbfs = -14.0
shm_prefix = "squeezelite"
# the faceplate views, in order: built-in names (night, cream,
# round, wall, wall-light, arc, orbit, modern, spectrum, bars) and/or [vu.skins]
# names; swiping
# the plate horizontally cycles through, the first entry is
# the start view
# (default: every built-in preset; a single entry pins a view)
#cycle = ["night", "wall-light", "amber"]


# named runtime skins: manifest.toml files (layered SVG art,
# see docs/vu.md) or .slint files for full control (the VuSkin
# contract, skins/minimal.slint); reference them in cycle by name

# analyzer options — info lines and full-width LED level
# meters (L/R) under the analyzer, both opt-in per view
[vu.spectrum]
#info = ["title", "artist", "quality"]
#meters = true
#gradient = true

[vu.bars]
#info = ["title", "artist"]
#meters = true
#gradient = true

[vu.skins]
#amber = "/etc/mestro/amber/manifest.toml"
#retro = "/etc/mestro/retro.slint"

# free-form options for the active runtime skin, pushed onto the
# skin component as properties
#[vu.skin-options]
#bars = 48
#face = "cream"

# the info lines under the meters live in the preset's own
# table: one field per line, rendered in a fixed hierarchy
# (1: 16px bold, 2: 13px dim, 3+: 12px muted; empty list = no
# info block). Fields: title, artist, codec, quality, time
[vu.night]
#info = ["title", "artist", "quality"]
# [vu.cream] and [vu.round] take the same `info` key, plus a
# warm lamp wash over the meter faces (0 = off, 1 = full)
#[vu.round]
#glow = 0.5

# the wall-light plate backlight: 0 = plain cream, 1 = full hot
# orange
[vu.wall-light]
#glow = 1.0

# the embedded web endpoint: the web app + WS channel on the LAN
# (docs/remote.md). Auth is the pairing PIN carried in the
# pairing URL's hash (restart-stable, stored 0600 in the state dir)
[remote]
#enabled = true
#port = 8787

# squeezelite (the player image, feature `audio-output`): empty = mestro
# derives the value; written by the web app (Settings → Audio), except
# `extra`, which is config-file only
[audio]
#output = ""   # ALSA device, e.g. hw:CARD=S3; empty = a USB DAC, else a HAT
#name = ""     # player name; empty = mestro-XXXX
#server = ""   # Music Assistant host; empty = the host of [music-assistant] url
#extra = ""    # further squeezelite flags, e.g. "-r -Z 100"

# the timezone picker (the player image, feature `timezone`): the zone
# is a device setting written by the web app
[system]
#timezone = ""

# the first-boot WiFi setup (the player image; config-file only — never
# in the settings editor). Everything resolves at runtime: one
# binary per board
[wifi]
# auto = the first wireless netdev (an entry under
# /sys/class/net/<if>/wireless, an up one preferred); a name pins one
#interface = "auto"
# the setup hotspot's own address: private a.b.c.d/16-29; the DHCP
# pool (.10-.50, clamped for small prefixes) and the captive portal
# derive from it
#ap-address = "10.42.0.1/24"
# wifi power save on the managed interface: off by default —
# brcmfmac's on state costs ~300 ms latency spikes and stream
# reconnects; mestro re-applies the state after every association
#power-save = false
# the regulatory domain (ISO 3166-1 alpha-2): empty = the kernel's
# stays (the passive world set "00" — 5 GHz restricted); a value
# also lands in every wpa_supplicant conf mestro writes
#country = "DE"
