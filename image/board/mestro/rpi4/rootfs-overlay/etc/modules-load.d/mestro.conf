# mestro kiosk: device drivers the busybox-init image loads at
# boot (no udev hotplug here).
#
# display: vc4/v3d KMS + the official 7" DSI panel chain
# (panel-simple + tc358762 bridge + attiny regulator — see the
# vc4-kms-dsi-7inch overlay)
vc4
v3d
panel-simple
tc358762
rpi-panel-attiny-regulator

# touch: the panel's microcontroller corrupts direct kernel i2c
# reads, so the firmware reads the touch chip and exposes it via
# the rpi-ft5406 overlay (vc4-kms-dsi-7inch,disable_touch +
# raspberrypi-ts — the classic piCorePlayer path)
raspberrypi-ts

# /dev/i2c-* for the debugging tools
i2c-dev

# onboard wifi (brcmfmac43455), firmware from linux-firmware
brcmfmac
