# mestro kiosk — wifi credentials. This file lives on the data
# partition (/data/wpa_supplicant.conf) and survives re-flashes.
#
# Scan: iw wlan0 scan | grep -E "SSID:|signal:"
#
# mestro manages the wifi from the panel/web setup (feature
# wifi-setup): the control socket below is what it talks over, and
# it rewrites this file (keeping a .bak) whenever a network is
# joined from the setup portal.

ctrl_interface=/run/wpa_supplicant
update_config=1

network={
	ssid="YourNetwork"
	psk="YourPassword"
	scan_ssid=1
}
